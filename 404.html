<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Victoria</title>
<script>
  // GitHub project pages live under /<repo>/ ; custom domains live at /
  var seg = location.pathname.split("/")[1];
  var base = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
  location.replace(base + "#/");
</script>
</head><body style="background:#0e0a0c"></body></html>
